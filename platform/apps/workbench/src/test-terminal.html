<!doctype html>
<html>
<head><meta charset="utf-8"><title>Test Terminal</title></head>
<body><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { TerminalPanel } from './ui/terminal/TerminalPanel.tsx';
import { BrowserPtyRuntimePort } from '../../packages/agent-runtime/pty/browserPtyRuntimePort.ts';
import { TerminalServiceImpl } from './logic/terminal/terminalService.ts';
import { BrowserPersistenceAdapter, TerminalPersistenceService } from './logic/terminal/terminalPersistence.ts';

const runtime = new BrowserPtyRuntimePort();
const service = new TerminalServiceImpl(runtime);
const persistence = new TerminalPersistenceService(new BrowserPersistenceAdapter());
service.attachPersistence(persistence);

const root = createRoot(document.getElementById('root'));
root.render(React.createElement(TerminalPanel, { sessionId: 'test', service, visible: true, onClosePanel: ()=>{}, onMaximize: ()=>{}, onRestore: ()=>{} }));
</script></body>
</html>
